# Dependabot 設定
# - github-actions: SHA ピン留めしたワークフローを週次で更新追従する（#138）
# - bundler: Gemfile.lock を週次で更新追従する
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # json 3.0+ は create_additions を含む未知オプションで ArgumentError を送出するようになり、
      # 本番の bin/rails db:migrate 起動時に落ちる回帰が発生した。Gemfile で "< 3" に固定している
      # （#281）が、Dependabot の json 3 系 PR はこの固定ごと "< 4" に書き換えるため、マージして
      # 回帰を再発させた（#282 → #287、#289 → #290）。json 3 へ上げられるまで major 更新は無視する。
      # update-types はセキュリティ更新の判定では使われず versions だけが効くため
      # （dependabot-core の IgnoreCondition#ignored_versions）、versions でも 3 系を除外し
      # セキュリティ更新 PR でも同じ回帰を踏まないようにする。2 系内の更新は従来どおり PR が来る。
      - dependency-name: "json"
        update-types: ["version-update:semver-major"]
        versions: [">= 3"]
      # image_processing 2.0+ は mini_magick / ruby-vips が soft dependency になり、Gemfile に
      # ruby-vips が無いと ActiveStorage の vips トランスフォーマーが LoadError になる（#279 で RSpec が
      # 全滅し、#280 で "~> 1.2" に固定）。Dependabot の 2 系 PR はこの固定ごと書き換える（#355）。
      # 本アプリは CarrierWave + mini_magick のみで image_processing を直接使っておらず、上げる利点が
      # 無いため、json と同様に versions でも 2 系を除外してセキュリティ更新 PR も抑止する。
      - dependency-name: "image_processing"
        update-types: ["version-update:semver-major"]
        versions: [">= 2"]

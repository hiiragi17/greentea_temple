name: Trivy image scan

# 本番イメージ（Dockerfile の runtime ステージ）を週 1 回スキャンし、
# ベース OS パッケージや gem に修正版のある HIGH / CRITICAL の脆弱性が出ていないか確認する。
# PR の CI とは分けているので、ここが失敗しても開発はブロックされない
# （定期実行の失敗は GitHub からリポジトリオーナーにメール通知される）。
on:
  schedule:
    - cron: "23 0 * * 1" # 毎週月曜 09:23 JST
  workflow_dispatch:
  # ベースイメージを変える PR ではその場で確認する
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/trivy.yml

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t greentea-temple:scan .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: greentea-temple:scan
          format: table
          # 修正版が出ているものだけを対象にする（未修正の CVE で毎週失敗し続けないように）
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

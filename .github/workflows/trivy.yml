name: Trivy image scan

# 修正版のある HIGH / CRITICAL の脆弱性を Trivy で検出する。
#
# - resolve-deployed / scan-deployed（週次 / 手動）: Cloud Run で今トラフィックを受けている
#   リビジョンのイメージ（ダイジェスト）を Artifact Registry から取得してスキャンする。
#   Dockerfile は apt-get upgrade でビルド時点の修正を取り込むため、新しくビルドした
#   イメージを調べても本番が古くなっていることは分からない。検出されたら
#   再デプロイ（deploy-cloud-run.yml の手動実行など）で最新の修正を取り込む
# - scan-build（PR）: Dockerfile を変える PR で、そのビルド結果をスキャンする
#
# PR の CI とは分けているので、ここが失敗しても開発はブロックされない。
# 定期実行の失敗通知は、cron を最後に変更したユーザー（無効化されたワークフローを再有効化した
# 場合はそのユーザー）に、GitHub の通知設定に従って届く。確実に気づくため、通知先のユーザーで
# Actions の失敗通知が有効になっていることを確認しておく。
on:
  schedule:
    - cron: "23 0 * * 1" # 毎週月曜 09:23 JST
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/trivy.yml

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_REGION: asia-northeast1
  SERVICE_NAME: greentea-temple

jobs:
  # Cloud Run で今トラフィックを受けているリビジョンを洗い出し、各リビジョンが
  # デプロイ時に解決したイメージのダイジェスト（status.imageDigest）を集める。
  # サービスのテンプレート（spec.template）のタグは、トラフィックを旧リビジョンに戻した場合や
  # 同じタグを上書きした場合に、実際に動いているイメージと一致しないため使わない
  resolve-deployed:
    name: Resolve deployed images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation（deploy-cloud-run.yml と同じ SA を使う）
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Resolve revisions receiving traffic
        id: resolve
        run: |
          revisions="$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${GCP_REGION}" --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | unique | .[]')"
          if [ -z "${revisions}" ]; then
            echo "::error::トラフィックを受けているリビジョンが見つかりませんでした" >&2
            exit 1
          fi
          images="[]"
          for rev in ${revisions}; do
            digest="$(gcloud run revisions describe "${rev}" \
              --region "${GCP_REGION}" --format='value(status.imageDigest)')"
            if [ -z "${digest}" ]; then
              echo "::error::リビジョン ${rev} のイメージダイジェストを取得できませんでした" >&2
              exit 1
            fi
            echo "${rev}: ${digest}"
            images="$(jq -c --arg d "${digest}" '. + [$d]' <<< "${images}")"
          done
          echo "images=$(jq -c 'unique' <<< "${images}")" >> "$GITHUB_OUTPUT"

  scan-deployed:
    name: Scan deployed image
    needs: resolve-deployed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve-deployed.outputs.images) }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Pull deployed image
        env:
          IMAGE_REF: ${{ matrix.image }}
        run: docker pull "${IMAGE_REF}"

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          # 修正版が出ているものだけを対象にする（未修正の CVE で毎週失敗し続けないように）
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  scan-build:
    name: Scan Dockerfile build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t greentea-temple:scan .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: greentea-temple:scan
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

name: Deploy to Cloud Run

# Workload Identity Federation / 各 secrets / vars が揃ったため、
# main への push で自動デプロイする（#118）。手動デプロイも引き続き可能。
#
# CI（rubocop / rspec）をゲートにするため push ではなく workflow_run で
# CI 完了を待ち受ける（docs/infra/deploy-cost-comparison.md 4-5 の設計方針）。
# workflow_run の GITHUB_SHA はデフォルトブランチの最新コミットを指し、
# CI が検証した実際のコミットとずれる可能性があるため、
# github.event.workflow_run.head_sha を明示的に使う
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "デプロイするイメージタグ（未指定なら commit SHA の先頭 12 桁）"
        required: false
        type: string

permissions:
  contents: read
  id-token: write # Workload Identity Federation

# 連続 push で新旧のデプロイ実行が競合し、古いビルドが後から完了して
# 新しいリビジョンを上書きしないよう直列化する。デプロイ先（Cloud Run
# サービス / Artifact Registry の :latest タグ）はトリガー元のブランチに
# 関わらず単一のため、グループはブランチで分けず固定名にする。
# cancel-in-progress は Cloud Run へのデプロイ処理を中途半端な状態で
# 中断させないよう false にする
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  GCP_REGION: asia-northeast1
  SERVICE_NAME: greentea-temple
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # workflow_run は CI の成功/失敗どちらでも発火するため、成功時のみ実行する。
    # workflow_dispatch には conclusion が存在しないので別途許可する
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.DEPLOY_SHA }}

      # inputs.image_tag を `run:` スクリプトに直接展開すると script injection
      # の余地があるため、必ず env 経由で受け取る。さらに Docker / OCI のタグ
      # 仕様 (https://docs.docker.com/reference/cli/docker/image/tag/#description)
      # に沿った形式かを正規表現で fail-fast 検証する
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            if ! [[ "${INPUT_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid image_tag: '${INPUT_TAG}'. Must match ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}\$" >&2
              exit 1
            fi
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${DEPLOY_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Actions の `jobs.<job_id>.env` では `secrets` コンテキストが
      # 参照できない（github / needs / strategy / matrix / vars / inputs のみ）。
      # IMAGE_BASE は GCP_PROJECT_ID（secret）を含むため、step output で組み立てる
      - name: Compose image base
        id: image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
        run: |
          echo "base=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        env:
          IMAGE_BASE: ${{ steps.image.outputs.base }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build \
            --tag "${IMAGE_BASE}:${IMAGE_TAG}" \
            --tag "${IMAGE_BASE}:latest" \
            --cache-from "${IMAGE_BASE}:latest" \
            .

      - name: Push image
        env:
          IMAGE_BASE: ${{ steps.image.outputs.base }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker push "${IMAGE_BASE}:${IMAGE_TAG}"
          docker push "${IMAGE_BASE}:latest"

      # 環境変数名はアプリ実コードが ENV[..] で参照している名前に合わせている:
      #   - GMAP_API           : config/initializers/geocoder.rb
      #   - GOOGLE_MAP_API     : app/views/**/*.erb (Google Maps JS API key)
      #   - GOOGLE_DIRECTIONS_API_KEY : app/services/directions_service.rb
      #     （モデルルートの経路・所要時間計算。未設定時は GOOGLE_MAPS_API_KEY に
      #     フォールバックするが、Cloud Run にはそちらを設定していないため
      #     このキーを明示的に渡す）
      #   - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET : Sorcery Google OAuth
      #     （config/initializers/sorcery.rb。未設定時は credentials の
      #     google.client_id / google.client_secret にフォールバック）
      # （CLAUDE.md / .env.example も同名で統一済み）
      #
      # SECRET_KEY_BASE / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET は
      # credentials.yml.enc にフォールバック値を持たせられるため、
      # unconditionally に渡すと secret 未設定時に空文字でフォールバックを
      # 上書きしてしまう。secret が存在するときのみ env_vars に含める
      - name: Compose Cloud Run env vars
        id: env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          APP_HOSTS: ${{ vars.APP_HOSTS }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          GMAP_API: ${{ secrets.GMAP_API }}
          GOOGLE_MAP_API: ${{ secrets.GOOGLE_MAP_API }}
          GOOGLE_DIRECTIONS_API_KEY: ${{ secrets.GOOGLE_DIRECTIONS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LINE_KEY: ${{ secrets.LINE_KEY }}
          LINE_SECRET: ${{ secrets.LINE_SECRET }}
        run: |
          {
            echo "vars<<__ENV_EOF__"
            echo "RAILS_ENV=production"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            if [ -n "${APP_HOSTS}" ]; then
              # deploy-cloudrun の env_vars はカンマ/改行を区切りとして解釈する。
              # APP_HOSTS は複数ホストをカンマ区切りで持つため、値内のカンマを
              # `\,` にエスケープして 1 つの env var として渡す
              echo "APP_HOSTS=${APP_HOSTS//,/\\,}"
            fi
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
            echo "RAILS_MASTER_KEY=${RAILS_MASTER_KEY}"
            echo "GMAP_API=${GMAP_API}"
            echo "GOOGLE_MAP_API=${GOOGLE_MAP_API}"
            echo "GOOGLE_DIRECTIONS_API_KEY=${GOOGLE_DIRECTIONS_API_KEY}"
            echo "LINE_KEY=${LINE_KEY}"
            echo "LINE_SECRET=${LINE_SECRET}"
            if [ -n "${SECRET_KEY_BASE}" ]; then
              echo "SECRET_KEY_BASE=${SECRET_KEY_BASE}"
            fi
            if [ -n "${GOOGLE_CLIENT_ID}" ]; then
              echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            fi
            if [ -n "${GOOGLE_CLIENT_SECRET}" ]; then
              echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
            fi
            echo "__ENV_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.image.outputs.base }}:${{ steps.tag.outputs.tag }}
          flags: --allow-unauthenticated --memory=512Mi --cpu=1 --min-instances=0 --max-instances=4
          env_vars: ${{ steps.env.outputs.vars }}

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)'
